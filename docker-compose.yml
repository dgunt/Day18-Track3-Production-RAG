# ============================================================
# Lab 18: Production RAG Pipeline — Docker Compose
# Chạy: docker compose up -d
# Dừng: docker compose down
# Xóa data: docker compose down -v
# ============================================================

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lab18_qdrant
    ports:
      - "6333:6333"   # REST API  — QDRANT_PORT trong config.py
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage   # Persistent storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
    driver: local
